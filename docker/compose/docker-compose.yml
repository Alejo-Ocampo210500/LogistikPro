name: logistikpro

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-logistikpro}
      POSTGRES_USER: ${DB_USERNAME:-logistikpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistikpro_test}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-logistikpro} -d ${DB_DATABASE:-logistikpro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/api/Dockerfile
    env_file:
      - path: ../../env/api.env
        required: false
    environment:
      APP_NAME: LogistikPro
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-logistikpro}
      DB_USERNAME: ${DB_USERNAME:-logistikpro}
      DB_PASSWORD: ${DB_PASSWORD:-logistikpro_test}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VUE_APP_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
